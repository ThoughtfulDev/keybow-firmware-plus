name: Build firmware SD card ZIP

on:
  push:
    tags:
      - 'firmware-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate firmware tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^firmware-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a tag such as firmware-v1.0.0' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
      - name: Build the complete SD card ZIP
        run: ./build-docker.sh
      - name: Verify SD card ZIP
        run: python3 packaging/check-firmware-zip.py
      - name: Name firmware ZIP for the tag
        run: cp build/keybow-sdcard.zip "build/keybow-firmware-plus-${GITHUB_REF_NAME}-sdcard.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-sdcard
          path: build/keybow-firmware-plus-firmware-v*-sdcard.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-sdcard
          path: release-assets
      - name: Require the complete firmware ZIP
        run: |
          test -s "release-assets/keybow-firmware-plus-${GITHUB_REF_NAME}-sdcard.zip"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
      - name: Create or update firmware Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
          fi
